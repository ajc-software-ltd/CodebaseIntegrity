[project]
name = "codebase-integrity"
description = "Codebase Integrity & Intelligence (CII) — persistent structural index for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "tree-sitter>=0.25",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "watchfiles>=1.0",
    "mcp>=2,<3",
]

[project.scripts]
cii = "cii.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cii/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests exercising live OS facilities (inotify, timing)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Parser fixtures contain deliberately representative (and deliberately
# invalid) source samples — they are test data, not lint targets.
exclude = ["tests/parsers/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I"]

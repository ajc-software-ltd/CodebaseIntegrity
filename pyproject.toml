[project]
name = "codebase-integrity"
description = "Codebase Integrity & Intelligence (CII) — persistent structural index for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
cii = "cii.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cii/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cii"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
